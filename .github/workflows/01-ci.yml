---
# CI: run tests on every push/PR.
# Keeps fast: no Docker build, no AWS calls. Tests run with in-memory/embedded backends.

name: "01 · CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -timeout 120s
        env:
          REGISTRY_BACKEND: memory
      - name: Job summary
        if: always()
        run: |
          echo "Backend (Go) — build + vet + \`go test\` with an in-memory registry, no Docker/AWS." >> "$GITHUB_STEP_SUMMARY"

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile $(find . -name "*.py" -not -path "./.venv/*")
      - run: python -m pytest tests/ -q
        env:
          # test_live_tool_call_endpoint.py imports app.py, which pulls in
          # config.settings.get_settings() at module load — without these,
          # its "not set in environment" fallback tries AWS Secrets Manager,
          # which this job has no credentials for (correctly — see this
          # file's header comment: CI makes no AWS calls). Dummy values only;
          # nothing here talks to Anthropic or Langfuse in these tests.
          ANTHROPIC_API_KEY: sk-ant-test-placeholder
          LANGFUSE_PUBLIC_KEY: test-placeholder
          LANGFUSE_SECRET_KEY: test-placeholder
      - name: Job summary
        if: always()
        run: |
          echo "Agent (Python) — compiles the FastAPI/Claude reasoning layer and runs its pytest suite." >> "$GITHUB_STEP_SUMMARY"

  discovery:
    name: Discovery (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/adapters/discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile $(find . -name "*.py" -not -path "./.venv/*")
      - run: python -m pytest tests/ -q
      - name: Job summary
        if: always()
        run: |
          echo "Discovery (Python) — compiles and tests the per-cluster collector (ADR 0022/0027) that watches the cluster and pushes events/inventory to the Hub." >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Job summary
        if: always()
        run: |
          echo "Frontend (TypeScript) — typechecks and builds the Ops/Admin UI (React + Vite)." >> "$GITHUB_STEP_SUMMARY"
