apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  namespace: payments
  labels:
    app: payment-worker
    vault-managed-certs: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-worker
  template:
    metadata:
      labels:
        app: payment-worker
    spec:
      serviceAccountName: payment-worker
      initContainers:
      - name: vault-cert-init
        # Stock Docker Hub image — see payment-service.yaml's identical
        # comment: this account has a NAT gateway, so no ECR-mirrored
        # "-tools" tag is needed.
        image: alpine:3.18
        command:
        - sh
        - -c
        - |
          set -e
          apk add --no-cache curl jq
          VAULT="http://vault.vault.svc.cluster.local:8200"
          JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          curl -sf -XPOST "$VAULT/v1/auth/kubernetes/login" \
            -H "Content-Type: application/json" \
            -d "{\"jwt\":\"$JWT\",\"role\":\"payments-payment-worker\"}" \
            -o /tmp/login.json
          TOKEN=$(jq -r '.auth.client_token' /tmp/login.json)
          [ "$TOKEN" = "null" ] && { cat /tmp/login.json; exit 1; }
          curl -sf -XPOST "$VAULT/v1/pki-payments/issue/payment-worker" \
            -H "X-Vault-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"common_name":"payment-worker.payments.svc.cluster.local","ttl":"720h"}' \
            -o /tmp/cert.json
          jq -r '.data.certificate + "\n" + .data.issuing_ca' /tmp/cert.json > /vault/secrets/tls.crt
          jq -r '.data.private_key' /tmp/cert.json > /vault/secrets/tls.key
          curl -sf "$VAULT/v1/secret/data/payments/config" \
            -H "X-Vault-Token: $TOKEN" -o /tmp/config.json 2>/dev/null \
            && jq -r '.data.data | to_entries[] | "export " + .key + "=\"" + .value + "\""' \
            /tmp/config.json > /vault/secrets/db-creds 2>/dev/null \
            || echo "# no db config" > /vault/secrets/db-creds
          echo "Vault secrets written"
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      containers:
      - name: worker
        image: alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          echo "payment-worker starting..."
          echo "Vault-injected files:"
          ls -la /vault/secrets/ 2>/dev/null && echo "Certs present ✅" || echo "Certs missing ❌"
          [ -f /vault/secrets/db-creds ] && . /vault/secrets/db-creds || true
          echo "DB_HOST: ${DB_HOST:-not set}"
          while true; do
            echo "payment-worker running — certs from Vault PKI"
            sleep 30
          done
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        resources:
          requests:
            memory: "16Mi"
            cpu:    "5m"
          limits:
            memory: "32Mi"
            cpu:    "50m"
      volumes:
      - name: vault-secrets
        emptyDir: {}
      restartPolicy: Always
