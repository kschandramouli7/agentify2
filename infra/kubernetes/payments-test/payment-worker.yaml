apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  namespace: payments
  labels:
    app: payment-worker
    vault-managed-certs: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-worker
  template:
    metadata:
      labels:
        app: payment-worker
    spec:
      serviceAccountName: payment-worker
      initContainers:
      - name: vault-cert-init
        # Stock Docker Hub image — see payment-service.yaml's identical
        # comment: this account has a NAT gateway, so no ECR-mirrored
        # "-tools" tag is needed.
        image: alpine:3.18
        command:
        - sh
        - -c
        - |
          set -e
          apk add --no-cache curl jq
          VAULT="http://vault.vault.svc.cluster.local:8200"
          JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          curl -sf -XPOST "$VAULT/v1/auth/kubernetes/login" \
            -H "Content-Type: application/json" \
            -d "{\"jwt\":\"$JWT\",\"role\":\"payments-payment-worker\"}" \
            -o /tmp/login.json
          TOKEN=$(jq -r '.auth.client_token' /tmp/login.json)
          [ "$TOKEN" = "null" ] && { cat /tmp/login.json; exit 1; }
          curl -sf -XPOST "$VAULT/v1/pki-payments/issue/payment-worker" \
            -H "X-Vault-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"common_name":"payment-worker.payments.svc.cluster.local","ttl":"720h"}' \
            -o /tmp/cert.json
          jq -r '.data.certificate + "\n" + .data.issuing_ca' /tmp/cert.json > /vault/secrets/tls.crt
          jq -r '.data.private_key' /tmp/cert.json > /vault/secrets/tls.key
          curl -sf "$VAULT/v1/secret/data/payments/config" \
            -H "X-Vault-Token: $TOKEN" -o /tmp/config.json 2>/dev/null \
            && jq -r '.data.data | to_entries[] | "export " + .key + "=\"" + .value + "\""' \
            /tmp/config.json > /vault/secrets/db-creds 2>/dev/null \
            || echo "# no db config" > /vault/secrets/db-creds
          echo "Vault secrets written"
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      containers:
      - name: worker
        image: alpine:3.19
        env:
        # Stable (false) for every regular deploy — a healthy baseline the
        # eval-regression gate and general health queries can answer
        # against. 05-payment-test.yml's Phase 3 flips this to "true" via
        # `kubectl set env` (not a manifest re-apply) to build real restart
        # history on demand, then flips it back in cleanup — the manifest
        # itself never changes.
        - name: CRASH_LOOP
          value: "false"
        # How often the outbound burst runs. Short enough that a scan cycle
        # always finds fresh evidence in the log tail; long enough to stay
        # negligible.
        - name: CALL_INTERVAL_SECONDS
          value: "30"
        command:
        - /bin/sh
        - -c
        - |
          echo "payment-worker starting..."
          echo "Vault-injected files:"
          ls -la /vault/secrets/ 2>/dev/null && echo "Certs present ✅" || echo "Certs missing ❌"
          [ -f /vault/secrets/db-creds ] && . /vault/secrets/db-creds || true
          echo "DB_HOST: ${DB_HOST:-not set}"
          if [ "$CRASH_LOOP" = "true" ]; then
            echo "CRASH_LOOP=true — simulating a crash for restart-trend testing (P4b, ADR 0013)"
            sleep 5
            exit 1
          fi
          # Outbound burst, every CALL_INTERVAL_SECONDS.
          #
          # Service-dependency discovery mines LOG TEXT, not network traffic
          # (agentify-discovery's _scan_namespace and the Glue miner both look
          # for "<service>.<namespace>[.svc.cluster.local]" and validate the
          # match against the live Service list). So the FQDN must be echoed —
          # making the call without logging it produces no edge at all.
          #
          # The hostname is logged whether or not the call succeeds, on purpose:
          # an unreachable dependency is still a dependency, and that is exactly
          # the case an operator most wants surfaced.
          while true; do
            echo "payment-worker running — certs from Vault PKI"
            for target in payment-api.payments.svc.cluster.local payment.payments.svc.cluster.local; do
              if wget -q -O- --no-check-certificate -T 3 "https://$target/" >/dev/null 2>&1; then
                echo "calling https://$target/ ok"
              else
                echo "calling https://$target/ unreachable"
              fi
            done
            sleep "${CALL_INTERVAL_SECONDS:-30}"
          done
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        resources:
          requests:
            memory: "16Mi"
            cpu:    "5m"
          limits:
            memory: "32Mi"
            cpu:    "50m"
      volumes:
      - name: vault-secrets
        emptyDir: {}
      restartPolicy: Always
---
# payment-worker had no Service, which made it invisible to dependency mining:
# both miners resolve from_service by matching a pod's labels against Service
# selectors and DROP the edge when nothing matches
#   from_service = _service_for_pod(pod["labels"], services)
#   if not from_service: continue
# so a worker with no Service can never be the source of an edge, however much
# it logs. Headless (clusterIP: None) because nothing needs to load-balance to
# it — the Service exists to make the workload nameable, which is also what
# lets other services depend on it.
apiVersion: v1
kind: Service
metadata:
  name: payment-worker
  namespace: payments
  labels:
    app: payment-worker
spec:
  clusterIP: None
  selector:
    app: payment-worker
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
