apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: payments
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-tls-config
  namespace: payments
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 443 ssl;
        server_name payment.payments.svc.cluster.local;
        ssl_certificate     /vault/secrets/tls.crt;
        ssl_certificate_key /vault/secrets/tls.key;
        location / {
          return 200 '{"status":"ok","service":"payment-service"}';
          add_header Content-Type application/json;
        }
        location /health {
          return 200 '{"status":"healthy"}';
          add_header Content-Type application/json;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: payments
  labels:
    app: payment
    vault-managed-certs: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      serviceAccountName: payment-api
      initContainers:
      - name: vault-cert-init
        # Stock Docker Hub image — this account has a NAT gateway (unlike
        # ADR 0021's original Fargate-profile-with-no-NAT assumption), so
        # both the image pull and apk's CDN fetch below reach the internet
        # fine; no pre-baked ECR-mirrored "-tools" tag needed.
        image: alpine:3.18
        command:
        - sh
        - -c
        - |
          set -e
          apk add --no-cache curl jq
          VAULT="http://vault.vault.svc.cluster.local:8200"
          JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          curl -sf -XPOST "$VAULT/v1/auth/kubernetes/login" \
            -H "Content-Type: application/json" \
            -d "{\"jwt\":\"$JWT\",\"role\":\"payments-payment-api\"}" \
            -o /tmp/login.json
          TOKEN=$(jq -r '.auth.client_token' /tmp/login.json)
          [ "$TOKEN" = "null" ] && { cat /tmp/login.json; exit 1; }
          curl -sf -XPOST "$VAULT/v1/pki-payments/issue/payment-api" \
            -H "X-Vault-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"common_name":"payment.payments.svc.cluster.local","alt_names":"localhost","ttl":"720h"}' \
            -o /tmp/cert.json
          jq -r '.data.certificate + "\n" + .data.issuing_ca' /tmp/cert.json > /vault/secrets/tls.crt
          jq -r '.data.private_key' /tmp/cert.json > /vault/secrets/tls.key
          echo "Vault cert written"
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      containers:
      - name: payment
        image: nginx:1.25-alpine
        ports:
        - containerPort: 443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: vault-secrets
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: nginx-tls-config
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: payments
spec:
  selector:
    app: payment
  ports:
  - name: https
    port: 443
    targetPort: 443
  type: ClusterIP
