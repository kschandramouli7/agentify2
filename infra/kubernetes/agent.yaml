apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentify-agent
  namespace: agentify
spec:
  replicas: 1
  # Allow 900s before the deployment controller marks the rollout as failed.
  # Must exceed the CI rollout-wait window (600s) so kubectl always sees the
  # deployment as "in progress" rather than "ProgressDeadlineExceeded" while
  # the stuck-pod cleanup loop is running.
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: agentify-agent
  template:
    metadata:
      labels:
        app: agentify-agent
      annotations: {}
    spec:
      serviceAccountName: agentify-agent
      # 200s = 190s uvicorn graceful shutdown + 10s buffer.
      # Ensures in-flight Claude Opus calls (up to 180s) complete before SIGKILL.
      terminationGracePeriodSeconds: 200
      containers:
      - name: agent
        image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/agentify/agent:latest
        ports:
        - containerPort: 8001
        lifecycle:
          preStop:
            exec:
              # Give the ALB 10s to deregister this pod before connections are closed.
              command: ["/bin/sh", "-c", "sleep 10"]
        env:
        - name: PORT
          value: "8001"
        - name: AWS_REGION
          value: "ap-southeast-2"
        - name: BACKEND_URL
          value: "http://agentify-backend:8080"
        # Log platform (Glue/Athena, ADR 0021) — get_logs() (k8fy/log_router.py)
        # tries this first for every namespace, falling back to the live
        # cluster on empty results or errors; no per-namespace registry, just
        # this connection config. One shared database/table across every
        # onboarded namespace/service (infra/terraform/aws/logging.tf's
        # `clusters` variable — onboarding a new service is a namespace added
        # to that list, not a new database/table). These names follow a fully
        # deterministic convention set by logging.tf (local.name-log-test /
        # local.glue_db_name / local.glue_table_name) rather than an
        # account-specific value like an IRSA ARN, so they're literal here
        # rather than substituted at deploy time — confirm against
        # `terraform output log_platform_athena_workgroup` /
        # `log_platform_glue_database` / `log_platform_glue_table_name` if
        # logging.tf's naming ever changes. Leave empty (or omit) if the test
        # harness isn't deployed — get_logs() then always uses the live cluster.
        - name: ATHENA_WORKGROUP
          value: "agentify-dev-log-test"
        - name: ATHENA_DATABASE
          value: "agentify_dev_logs"
        - name: ATHENA_TABLE
          value: "pod_logs"
        # ANTHROPIC_API_KEY from Secrets Manager secret agentify/dev/anthropic
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: agentify-anthropic-secret
              key: api_key
        # Voyage AI key for semantic memory embeddings (P8).
        # optional: true — agent starts normally without it; get_similar_incidents
        # falls back to recency-ordered results instead of vector similarity.
        - name: VOYAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: agentify-voyage-secret
              key: api_key
              optional: true
        # Vault connectivity for VaultCertSkill (optional — skill degrades gracefully if unset).
        - name: VAULT_ADDR
          value: "http://vault.vault.svc.cluster.local:8200"
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-vault-secret
              key: token
              optional: true   # agent starts normally if Vault is not deployed
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: agentify-agent
  namespace: agentify
spec:
  selector:
    app: agentify-agent
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentify-agent
  namespace: agentify
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_TERRAFORM_OUTPUT_agent_irsa_role_arn"
