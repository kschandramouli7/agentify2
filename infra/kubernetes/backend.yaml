# TEMPLATE — DO NOT `kubectl apply -f` THIS FILE DIRECTLY.
# The image tag/registry (ACCOUNT_ID.dkr.ecr...) and the IRSA role-arn
# annotation (REPLACE_WITH_TERRAFORM_OUTPUT_*) below are placeholders that
# 02-deploy.yml sed's into a real value on every deploy — the checked-in copy
# always keeps them literally. Applying this file as-is pushes those literal
# placeholders into the live Deployment spec, including rolling the running
# container image back to an unpullable string (caught live 2026-09-13,
# ROADMAP OPS-2). For a one-off live change, patch the specific field —
# `kubectl set env` / `kubectl patch` (see scripts/safe-kubectl-apply.sh,
# which refuses to apply any file still containing these placeholders). To
# actually deploy a manifest change, push it through 02-deploy.yml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentify-backend
  namespace: agentify
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_TERRAFORM_OUTPUT_backend_irsa_role_arn"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentify-backend
  namespace: agentify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentify-backend
  template:
    metadata:
      labels:
        app: agentify-backend
      annotations: {}
    spec:
      serviceAccountName: agentify-backend
      containers:
      - name: backend
        image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/agentify/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: ":8080"
        - name: ENV
          value: "prod"
        - name: AWS_REGION
          value: "ap-southeast-2"
        - name: REGISTRY_BACKEND
          value: "dynamodb"
        - name: AGENT_SERVICE_URL
          value: "http://agentify-agent:8001"
        # DB credentials from Secrets Manager secret agentify/dev/db
        # Loaded via init container or External Secrets Operator; shown here as
        # individual env vars for clarity.
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: dbname
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: password
        - name: REDACTION_ENABLED
          value: "true"
        - name: EVENTS_RETENTION_DAYS
          value: "7"
        - name: EVENTS_RETENTION_INTERVAL_MINUTES
          value: "60"
        - name: INVESTIGATION_ENABLED
          value: "false"   # opt-in; set to "true" and add INVESTIGATION_WEBHOOK_URL to enable
        # Phase-3 remediation (ADR 0020 / spec 011 Use Cases 1+2) — every write
        # action is proposed first and only executed after explicit human
        # approval; both loops default off.
        #
        # An unset REMEDIATION_AUTH_TOKEN now FAILS CLOSED outside dev (ADR
        # 0020 amendment, ROADMAP OPS-3, 2026-09-12): approve/reject execute a
        # real K8s write (restart/scale/rollback), and the two ENABLED flags
        # below are one config change away from making that reachable, so an
        # unset token disables the endpoints entirely here (ENV=prod) rather
        # than leaving them open. Create the secret once before ever setting
        # either ENABLED flag to "true":
        #   kubectl create secret generic agentify-remediation-secret \
        #     -n agentify --from-literal=auth-token="$(openssl rand -hex 32)"
        - name: AUTONOMOUS_REMEDIATION_ENABLED
          value: "false"
        - name: DEPLOY_GUARDIAN_ENABLED
          value: "false"
        - name: REMEDIATION_PROPOSAL_TTL_MINUTES
          value: "30"
        - name: REMEDIATION_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-remediation-secret
              key: auth-token
              optional: true  # absent secret -> empty token -> fails closed outside dev, not a crash
        # Version-pinned prompt evaluation (ADR 0030 / P19 gap D1). Guards
        # POST /admin/eval/query, which can make the agent answer using an
        # arbitrary prompt version — a behaviour-substitution lever, hence its
        # own token rather than exposure on the unauthenticated /api/query.
        #
        # An unset token FAILS CLOSED outside dev (ADR 0030 amendment,
        # 2026-09-01) — this comment previously said empty means "OPEN,
        # matching the posture of REMEDIATION_AUTH_TOKEN and COLLECTOR_TOKEN,"
        # which stopped being true the day this endpoint was fixed and was
        # left stale; REMEDIATION_AUTH_TOKEN now has the same fail-closed
        # posture too (above).
        #
        # ROADMAP OPS-2 (2026-09-13): sourced from a Secret, same
        # secretKeyRef/optional pattern as REMEDIATION_AUTH_TOKEN above —
        # create it once, using the SAME value as the EVAL_AUTH_TOKEN GitHub
        # Actions secret so 10-prompt-gate.yml can authenticate:
        #   kubectl create secret generic agentify-eval-secret \
        #     -n agentify --from-literal=auth-token="<same value as the GH secret>"
        - name: EVAL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-eval-secret
              key: auth-token
              optional: true  # absent secret -> empty token -> fails closed outside dev, not a crash
        # Active-verification engagements (ROADMAP P30 phases 2-4, ADR 0033).
        # Same propose/approve-gate shape as remediation above — an unset
        # SECURITY_ENGAGEMENT_AUTH_TOKEN fails closed outside dev from day
        # one (not an amendment needed later, unlike REMEDIATION_AUTH_TOKEN/
        # EVAL_AUTH_TOKEN's own history — ROADMAP OPS-2/OPS-3).
        #   kubectl create secret generic agentify-security-engagement-secret \
        #     -n agentify --from-literal=auth-token="$(openssl rand -hex 32)"
        - name: SECURITY_ENGAGEMENT_PROPOSAL_TTL_MINUTES
          value: "30"
        - name: SECURITY_ENGAGEMENT_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-security-engagement-secret
              key: auth-token
              optional: true  # absent secret -> empty token -> fails closed outside dev, not a crash
        # Where the isolated executor lives (infra/kubernetes/security-verifier.yaml)
        # — agentify-agent has no route here at all, only this backend does.
        - name: SECURITY_VERIFIER_URL
          value: "http://agentify-security-verifier:8400"
        # Shared secret with security-verifier's own SECURITY_VERIFIER_TOKEN
        # — defense in depth on top of network isolation, not the primary
        # boundary (that Service has no Ingress).
        #   kubectl create secret generic agentify-security-verifier-secret \
        #     -n agentify --from-literal=token="$(openssl rand -hex 32)"
        - name: SECURITY_VERIFIER_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-security-verifier-secret
              key: token
              optional: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: agentify-backend
  namespace: agentify
spec:
  selector:
    app: agentify-backend
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
