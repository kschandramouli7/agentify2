apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentify-backend
  namespace: agentify
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_TERRAFORM_OUTPUT_backend_irsa_role_arn"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentify-backend
  namespace: agentify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentify-backend
  template:
    metadata:
      labels:
        app: agentify-backend
      annotations: {}
    spec:
      serviceAccountName: agentify-backend
      containers:
      - name: backend
        image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/agentify/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: ":8080"
        - name: ENV
          value: "prod"
        - name: AWS_REGION
          value: "ap-southeast-2"
        - name: REGISTRY_BACKEND
          value: "dynamodb"
        - name: AGENT_SERVICE_URL
          value: "http://agentify-agent:8001"
        # DB credentials from Secrets Manager secret agentify/dev/db
        # Loaded via init container or External Secrets Operator; shown here as
        # individual env vars for clarity.
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: dbname
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentify-db-secret
              key: password
        - name: REDACTION_ENABLED
          value: "true"
        - name: EVENTS_RETENTION_DAYS
          value: "7"
        - name: EVENTS_RETENTION_INTERVAL_MINUTES
          value: "60"
        - name: INVESTIGATION_ENABLED
          value: "false"   # opt-in; set to "true" and add INVESTIGATION_WEBHOOK_URL to enable
        # Phase-3 remediation (ADR 0020 / spec 011 Use Cases 1+2) — every write
        # action is proposed first and only executed after explicit human
        # approval; both loops default off.
        #
        # An unset REMEDIATION_AUTH_TOKEN now FAILS CLOSED outside dev (ADR
        # 0020 amendment, ROADMAP OPS-3, 2026-09-12): approve/reject execute a
        # real K8s write (restart/scale/rollback), and the two ENABLED flags
        # below are one config change away from making that reachable, so an
        # unset token disables the endpoints entirely here (ENV=prod) rather
        # than leaving them open. Create the secret once before ever setting
        # either ENABLED flag to "true":
        #   kubectl create secret generic agentify-remediation-secret \
        #     -n agentify --from-literal=auth-token="$(openssl rand -hex 32)"
        - name: AUTONOMOUS_REMEDIATION_ENABLED
          value: "false"
        - name: DEPLOY_GUARDIAN_ENABLED
          value: "false"
        - name: REMEDIATION_PROPOSAL_TTL_MINUTES
          value: "30"
        - name: REMEDIATION_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-remediation-secret
              key: auth-token
              optional: true  # absent secret -> empty token -> fails closed outside dev, not a crash
        # Version-pinned prompt evaluation (ADR 0030 / P19 gap D1). Guards
        # POST /admin/eval/query, which can make the agent answer using an
        # arbitrary prompt version — a behaviour-substitution lever, hence its
        # own token rather than exposure on the unauthenticated /api/query.
        #
        # An unset token FAILS CLOSED outside dev (ADR 0030 amendment,
        # 2026-09-01) — this comment previously said empty means "OPEN,
        # matching the posture of REMEDIATION_AUTH_TOKEN and COLLECTOR_TOKEN,"
        # which stopped being true the day this endpoint was fixed and was
        # left stale; REMEDIATION_AUTH_TOKEN now has the same fail-closed
        # posture too (above). Set it from a Secret (same secretKeyRef pattern
        # as DB_PASSWORD) before this cluster carries anything that matters,
        # and set the same value as the EVAL_AUTH_TOKEN GitHub secret so
        # 10-prompt-gate.yml can authenticate.
        - name: EVAL_AUTH_TOKEN
          value: ""
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: agentify-backend
  namespace: agentify
spec:
  selector:
    app: agentify-backend
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
