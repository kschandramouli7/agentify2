# TEMPLATE — DO NOT `kubectl apply -f` THIS FILE DIRECTLY.
# The image tag/registry (ACCOUNT_ID.dkr.ecr...) below is a placeholder that
# 02-deploy.yml sed's into a real value on every deploy — the checked-in copy
# always keeps it literally. Applying this file as-is pushes that literal
# placeholder into the live Deployment spec, rolling the running container
# image back to an unpullable string (caught live 2026-09-13, ROADMAP OPS-2,
# on a sibling manifest with the same pattern). For a one-off live change,
# patch the specific field — `kubectl set env` / `kubectl patch` (see
# scripts/safe-kubectl-apply.sh, which refuses to apply any file still
# containing this placeholder). To actually deploy a manifest change, push
# it through 02-deploy.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentify-discovery
  namespace: agentify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentify-discovery
  template:
    metadata:
      labels:
        app: agentify-discovery
      annotations: {}
    spec:
      serviceAccountName: agentify-discovery
      # Graceful shutdown: the default 60s scan cycle always finishes well
      # inside this window (see main.py's SIGTERM handler).
      terminationGracePeriodSeconds: 90
      containers:
      - name: discovery
        image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/agentify/discovery:latest
        ports:
        - name: health
          containerPort: 8300
          protocol: TCP
        env:
        - name: BACKEND_URL
          value: "http://agentify-backend:8080"
        - name: SCAN_INTERVAL_SECONDS
          value: "60"
        - name: MAX_PODS_PER_NAMESPACE
          value: "5"
        - name: LOG_TAIL_LINES
          value: "200"
        - name: NAMESPACE_EXCLUDE
          value: "kube-system,kube-public,kube-node-lease"
        - name: HEALTH_PORT
          value: "8300"
        # The bearer credential resolveTenantContext (src/backend/internal/api/handlers.go)
        # matches against Integration.CollectorToken to derive this cluster's
        # (tenant_id, cluster_id) — no separate CLUSTER_ID/TENANT_ID env here,
        # see ADR 0022's amendment note. Minted via POST/PUT /admin/integrations'
        # collector_token field; synced into this Secret from Secrets Manager
        # by CI (ADR 0027 — this is now the only collector credential; the
        # retired k8fy adapter's separate agentify-adapter-secret is gone).
        - name: COLLECTOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentify-discovery-secret
              key: collector_token
        livenessProbe:
          httpGet:
            path: /health
            port: 8300
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8300
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentify-discovery
  namespace: agentify

---
# Cluster-wide, not namespace-scoped like agent-live-diagnostics
# (infra/kubernetes/payments-test/serviceaccounts.yaml): this collector's job
# is fleet-wide namespace/service discovery within its own cluster (ADR 0022
# / ROADMAP P18 use case #1's discovery step), not one fixed namespace.
#
# ADR 0027: this ClusterRole also covers what the retired src/adapters/k8fy
# adapter's separate ClusterRole used to grant — `watch` on pods/services/
# deployments (continuous change-event streams, watch.py) alongside the
# `list`/`get` every other scan already used. Not a blind union of the two
# original grants: only resources an actual ported watcher/scraper uses got
# `watch` added (the old adapter's ClusterRole also had unused `watch` on
# secrets/events that no watcher method ever consumed).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentify-discovery
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["list", "get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "get", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["list", "get", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list", "get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["list", "get", "watch"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "daemonsets"]
  verbs: ["list", "get"]
# ADR 0024 / live_get_certificates: the first Secrets read access this
# collector has ever been granted. Deliberately NOT namespace-wide-blind —
# k8s_client.list_tls_secrets always applies a server-side
# fieldSelector=type=kubernetes.io/tls, so this grant only ever surfaces TLS
# secrets, never arbitrary ones (app credentials, service-account tokens,
# etc.), and live_get_certificates never returns the decoded cert/key bytes
# themselves, only parsed expiry metadata. RBAC itself cannot express a
# field-selector restriction, so this is enforced by the client, not by
# Kubernetes — flagged here so a future reviewer knows this ClusterRole
# grants list/get on ALL Secrets cluster-wide, and the narrowing is a
# code-level guarantee, not an RBAC one.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list", "get"]
# Ingress/entry-point mapping (ROADMAP P18 use case #3). networking.k8s.io is
# core-ish (present since K8s 1.19) so this rule is always meaningful.
# gateway.networking.k8s.io and route.openshift.io are CRD-based and only
# exist on some clusters (Gateway API, OpenShift respectively) — a rule
# referencing an API group/resource that isn't registered on a given cluster
# is simply inert, not an error, so this one rule set works unmodified across
# EKS/vanilla K8s/OpenShift without per-distribution manifest variants (same
# reasoning k8s_client.py's discover_api_capabilities uses to decide whether
# to even call these APIs).
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["list", "get"]
# ROADMAP P30 phase 1 (ADR 0033) / OPS-14's own finding, taken as a lesson:
# the whole point of the namespace-has-networkpolicy check is to report an
# absence, so this grant is deliberately the narrowest verb set that check
# needs — list/get, never watch/create/update/delete — and read-only,
# matching every other rule in this ClusterRole.
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["list", "get"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "httproutes"]
  verbs: ["list", "get"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["list", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentify-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentify-discovery
subjects:
- kind: ServiceAccount
  name: agentify-discovery
  namespace: agentify
