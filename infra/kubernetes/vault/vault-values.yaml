# HashiCorp Vault — dev/test deployment on EKS
#
# Uses Vault dev mode: in-memory storage, pre-initialised, pre-unsealed.
# No PVC required — eliminates all StorageClass / WaitForFirstConsumer issues.
#
# Trade-off: Vault data is lost when the pod restarts.  For dev/test cert
# rotation testing this is acceptable — re-run scripts/vault-setup.sh after
# a pod restart to restore PKI engine, auth, and policies (~60 seconds).
#
# Install:
#   helm repo add hashicorp https://helm.releases.hashicorp.com
#   helm repo update
#   helm install vault hashicorp/vault \
#     --namespace vault --create-namespace \
#     -f infra/kubernetes/vault/vault-values.yaml
#
# After install the deploy pipeline calls vault-setup.sh automatically.
#
# No public Ingress (ROADMAP OPS-14, 2026-09-14): a dev-mode Vault with a
# published root token has no business on the internet-facing ALB. Reach
# the UI via `kubectl port-forward -n vault svc/vault 8200:8200` and open
# http://localhost:8200/ui/, token = "root".

global:
  enabled: true

server:
  # Dev mode: in-memory storage, pre-initialised, pre-unsealed.
  # Root token is "root" — predictable, fine for dev.
  dev:
    enabled:      true
    devRootToken: "root"

  # No persistent storage in dev mode.
  dataStorage:
    enabled: false

  resources:
    requests:
      memory: "256Mi"
      cpu:    "250m"
    limits:
      memory: "512Mi"
      cpu:    "500m"

  serviceAccount:
    create: true
    name:   vault

  # Dev mode starts sealed=false and initialized=true so the health endpoint
  # returns 200 immediately — no custom readiness path needed.
  readinessProbe:
    enabled: true
    path:    /v1/sys/health

# Vault Agent Injector — mutates pods carrying vault.hashicorp.com annotations.
injector:
  enabled:  true
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu:    "50m"
    limits:
      memory: "128Mi"
      cpu:    "250m"

ui:
  enabled:     true
  serviceType: ClusterIP   # exposed via vault-ingress.yaml (shared agentify ALB)
